```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casamento Emilly e Alessandro</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #fff;
  font-family: Georgia, serif;
}

#capa {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #fff;
  overflow: hidden;
  cursor: pointer;
}

#envelope {
  width: 100%;
  height: 100%;
  object-fit: contain;
  transition: transform 1.2s ease, opacity 1.2s ease;
}

#capa.abrindo #envelope {
  transform: scale(1.08);
  opacity: 0.25;
}

#luz {
  position: absolute;
  inset: 0;
  background: white;
  opacity: 0;
  pointer-events: none;
}

#capa.abrindo #luz {
  animation: claridade 2s ease forwards;
}

@keyframes claridade {
  0% { opacity: 0; }
  45% { opacity: 1; }
  100% { opacity: 0; }
}

#convite {
  display: none;
  position: relative;
  width: 100%;
  max-width: 700px;
  margin: 0 auto;
  line-height: 0;
}

#convite img {
  display: block;
  width: 100%;
  height: auto;
}

.icone-link {
  position: absolute;
  display: block;
  z-index: 2;
  background: transparent;
  cursor: pointer;
}

/* Áreas clicáveis sobre os ícones do convite */
#localizacao {
  left: 7%;
  top: 55%;
  width: 27%;
  height: 7%;
}

#confirmacao {
  left: 36%;
  top: 62%;
  width: 29%;
  height: 7%;
}

#presentes {
  left: 7%;
  top: 69%;
  width: 28%;
  height: 8%;
}

@media (min-width: 701px) {
  #convite {
    max-width: 520px;
  }
}
</style>
</head>

<body>

<audio id="musica" loop preload="auto">
  <source src="musica.mp3" type="audio/mpeg">
</audio>

<div id="capa" role="button" tabindex="0"
     aria-label="Abrir convite de casamento">
  <img id="envelope" src="1.png" alt="Capa do convite">
  <div id="luz"></div>
</div>

<main id="convite">
  <img src="2.png" alt="Convite de casamento de Emilly e Alessandro">

  <a class="icone-link"
     id="localizacao"
     href="https://maps.app.goo.gl/V7qybwPfnPVQTwqT7?g_st=ic"
     target="_blank"
     rel="noopener"
     aria-label="Abrir localização"></a>

  <span class="icone-link"
        id="confirmacao"
        aria-label="Confirmação de presença"></span>

  <a class="icone-link"
     id="presentes"
     href="https://convidapay.lovable.app/l/casamentoemillyealessandro"
     target="_blank"
     rel="noopener"
     aria-label="Abrir lista de presentes"></a>
</main>

<script>
const capa = document.getElementById("capa");
const convite = document.getElementById("convite");
const musica = document.getElementById("musica");
let iniciou = false;

function abrirConvite() {
  if (iniciou) return;
  iniciou = true;

  musica.volume = 0.7;
  musica.play().catch(() => {
    // Alguns navegadores exigem uma interação para tocar música.
  });

  capa.classList.add("abrindo");

  setTimeout(() => {
    capa.style.display = "none";
    convite.style.display = "block";
    window.scrollTo(0, 0);
  }, 1800);
}

capa.addEventListener("click", abrirConvite);

capa.addEventListener("keydown", (evento) => {
  if (evento.key === "Enter" || evento.key === " ") {
    evento.preventDefault();
    abrirConvite();
  }
});

window.addEventListener("load", () => {
  musica.play().catch(() => {
    // Se o navegador bloquear o som automático,
    // a música será iniciada ao clicar na capa.
  });
});
</script>

</body>
</html>
```
