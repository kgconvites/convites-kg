<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Convite de Casamento</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, serif;
      background: #f8f5f0;
      color: #333;
      min-height: 100vh;
    }

    .convite {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      text-align: center;
    }

    .capa {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 25px;
    }

    .titulo {
      font-size: 18px;
      letter-spacing: 3px;
      margin-bottom: 25px;
      text-transform: uppercase;
    }

    .nomes {
      font-size: 42px;
      font-weight: normal;
      line-height: 1.2;
      margin-bottom: 25px;
    }

    .data {
      font-size: 18px;
      letter-spacing: 2px;
    }

    .mensagem {
      margin-top: 35px;
      font-size: 16px;
      line-height: 1.6;
      max-width: 450px;
    }

    .secao {
      padding: 60px 25px;
    }

    .secao h2 {
      font-size: 28px;
      font-weight: normal;
      margin-bottom: 20px;
    }

    .botao {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 25px;
      border: none;
      border-radius: 30px;
      background: #333;
      color: white;
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <main class="convite">

    <section class="capa">
      <div class="titulo">Nosso casamento</div>

      <h1 class="nomes">
        Nome &amp; Nome
      </h1>

      <div class="data">
        00 • 00 • 0000
      </div>

      <p class="mensagem">
        Estamos muito felizes em compartilhar esse momento
        tão especial com você.
      </p>
    </section>

    <section class="secao">
      <h2>Você é nosso convidado</h2>

      <p>
        Em breve você poderá conferir todos os detalhes
        do nosso grande dia.
      </p>

      <a href="#" class="botao">
        Confirmar presença
      </a>
    </section>

  </main>

</body>
</html>
