
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casamento Emilly e Alessandro</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: #f8f5f0; }

#capa {
  position: fixed;
  inset: 0;
  z-index: 2;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f8f5f0;
  cursor: pointer;
  transition: opacity 1s ease, visibility 1s ease;
}

#envelope {
  width: min(100vw, 500px);
  height: auto;
  display: block;
  transform-origin: center;
}

#capa.abrindo #envelope {
  animation: abrir 1.6s ease forwards;
}

#capa.sumir {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

@keyframes abrir {
  0% { transform: scale(1); opacity: 1; }
  45% { transform: scale(1.06) rotateX(8deg); }
  100% { transform: scale(1.12); opacity: 0; }
}

#convite {
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  position: relative;
}

#convite img {
  display: block;
  width: 100%;
  height: auto;
}

.area {
  position: absolute;
  display: block;
  background: transparent;
  border: 0;
}

#local {
  left: 12%;
  top: 54%;
  width: 76%;
  height: 5%;
}

#confirmacao {
  left: 12%;
  top: 61%;
  width: 76%;
  height: 5%;
}

#presentes {
  left: 12%;
  top: 67%;
  width: 76%;
  height: 5%;
}

@media (prefers-reduced-motion: reduce) {
  #capa, #capa.abrindo #envelope {
    animation: none;
    transition: none;
  }
}
</style>
</head>
<body>

<div id="capa" role="button" tabindex="0" aria-label="Abrir convite">
  <img id="envelope" src="1.png" alt="Toque para abrir o convite">
</div>

<main id="convite" hidden>
  <img src="2.png" alt="Convite de casamento de Emilly e Alessandro">

  <a class="area" id="local"
     href="https://maps.app.goo.gl/V7qybwPfnPVQTwqT7?g_st=ic"
     target="_blank" rel="noopener" aria-label="Ver localização"></a>

  <span class="area" id="confirmacao"
        aria-label="Confirmação de presença"></span>

  <a class="area" id="presentes"
     href="https://convidapay.lovable.app/l/casamentoemillyealessandro"
     target="_blank" rel="noopener" aria-label="Lista de presentes"></a>
</main>

<script>
const capa = document.getElementById('capa');
const convite = document.getElementById('convite');
let iniciado = false;

function abrirConvite() {
  if (iniciado) return;
  iniciado = true;

  capa.classList.add('abrindo');

  setTimeout(() => {
    convite.hidden = false;
    capa.classList.add('sumir');
    window.scrollTo(0, 0);
  }, 1600);
}

capa.addEventListener('click', abrirConvite);

capa.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    abrirConvite();
  }
});
</script>

</body>
</html>
